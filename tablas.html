<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
    <style>
        body { background-color: #e3f2fd; font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #0d47a1; }
        h3 { color: #1565c0; }
        a { color: #1565c0; }
        table { border-collapse: collapse; background-color: white; }
        th { background-color: #1565c0; color: white; }
    </style>
</head>
<body>

    <h1> Mi tabla </h1>
    <h3>Verbo "to be" en presente</h3>
    <table border="1" cellpadding="8">
        <tr>
            <th>Pronombre</th>
            <th>Verbo</th>
            <th>Ejemplo</th>
        </tr>
        <tr><td>I</td><td>am</td><td>I am a student.</td></tr>
        <tr><td>You</td><td>are</td><td>You are my friend.</td></tr>
        <tr><td>He / She / It</td><td>is</td><td>She is happy.</td></tr>
        <tr><td>We</td><td>are</td><td>We are in class.</td></tr>
        <tr><td>They</td><td>are</td><td>They are teachers.</td></tr>
    </table>
    <br>
    <a href="index.html">Volver al inicio</a>

</body>
</html>
